
<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Install App</title>
</head>
<body>
  <h1>Karibu kwenye App yangu</h1>
  <p>Bonyeza kitufe hapa chini kuendelea.</p>

  <button onclick="installApp()">Install App</button>

  <script>
    let installPrompt;

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      installPrompt = event;
    });

    async function installApp() {
      if (installPrompt) {
        installPrompt.prompt();
        await installPrompt.userChoice;
        installPrompt = null;
      } else {
        alert("Fungua menyu ya browser kisha chagua Install app au Add to Home screen ikiwa ipo.");
      }
    }
  </script>
</body>
</html>
